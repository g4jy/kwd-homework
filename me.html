<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korean with Dongjae</title>
<meta name="theme-color" content="#F6F7FB">
<link rel="manifest" href="manifest-me.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=20261031221719">
<style>
/* T109 학생 허브: 링크 하나 → 오늘 과제 · 수업(화이트보드) · 단어 카드. 토큰은 app.css :root (앱 디자인 언어) */
.hub { max-width: 480px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 20px 40px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.hub h1 { font-size: 28px; line-height: 1.2; margin: 16px 0 24px; font-weight: 700; letter-spacing: -0.01em; }
.hub-tiles { display: flex; flex-direction: column; gap: 12px; }
.hub-tile { display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 16px 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s ease; }
.hub-tile:active { transform: scale(.98); }
.hub-tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hub-tile.main { background: var(--stamp); border-color: var(--stamp); color: var(--on-stamp); }
.hub-tile.off { opacity: .55; pointer-events: none; }
.hub-ic { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
.hub-tile.main .hub-ic { background: rgba(255,255,255,.18); color: var(--on-stamp); }
.hub-ic svg { width: 26px; height: 26px; }
.hub-t { flex: 1; min-width: 0; }
.hub-t b { display: block; font-size: 19px; line-height: 1.3; font-weight: 600; }
.hub-t span { display: block; font-size: 15px; line-height: 1.4; margin-top: 2px; color: var(--ink-2); }
.hub-tile.main .hub-t span { color: var(--on-stamp); opacity: .9; }
.hub-go { flex: none; width: 20px; height: 20px; opacity: .6; }
.hub-next { margin: 24px 0 0; font-size: 16px; color: var(--ink); }
.hub-next small { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 2px; }
.hub-tip { margin-top: auto; padding-top: 32px; font-size: 13px; color: var(--ink-2); }
.hub-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.hub-state h2 { font-size: 20px; margin: 0; }
.hub-state p { margin: 0; color: var(--ink-2); font-size: 15px; }
.hub-btn { min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.hub-skel { height: 88px; border-radius: var(--radius); background: var(--surface-2); animation: hubp 1.2s ease-in-out infinite; }
.hub-skel.h { height: 34px; width: 55%; margin: 16px 0 24px; }
@keyframes hubp { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .hub-skel { animation: none; } .hub-tile { transition: none; } }
@media (display-mode: standalone) { .hub-tip { display: none; } }
</style>
</head>
<body>
<div id="app" class="hub" aria-live="polite"></div>
<script src="config.js?v=20261031221719"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var PREVIEW = /(^|[#&])preview\b/.test(location.hash || '');   // 선생님 미리 보기: 키 기억 안 함·요청 저장 안 함
  var KEEP = 60 * 864e5, SK = 'hw_student_key';   // student.html 과 같은 저장 칸 (같은 사이트)
  function qs(n) { var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
  function get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 사생활 모드 */ } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var IC = {
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5z"/><path d="M9 8h7M9 11.5h5"/>',
    board: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 12l3-3 2 2 4-4"/>',
    cards: '<rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/>',
    go: '<path d="M9 5l7 7-7 7"/>'
  };
  function svg(n, cls) { return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>'; }
  function state(title, text, btn) {
    app.innerHTML = '<div class="hub-state" role="status"><h2>' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') + (btn || '') + '</div>';
  }

  var k = qs('k'), saved = get(SK);
  if (saved && (typeof saved !== 'object' || !saved.k || Date.now() - (saved.at || 0) > KEEP)) { put(SK, null); saved = null; }
  if (!k && !PREVIEW && saved) k = saved.k;
  if (!k) { state('Link needed', 'Please open the link Dongjae sent you.'); return; }
  if (!PREVIEW) put(SK, { k: k, at: Date.now() });
  if (PREVIEW) { var bar = document.createElement('div'); bar.className = 'preview-bar'; bar.textContent = '선생님 미리 보기 — 기록이 남지 않아요.'; document.body.insertBefore(bar, document.body.firstChild); }

  function call(action, extra) {
    var body = { action: action, key: k }; for (var x in extra || {}) body[x] = extra[x];
    return fetch(window.HW_CONFIG.API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error || 'error'); e.server = true; throw e; } return j.data; });
  }
  function fail(e) {
    if (e && e.server && /unknown key/.test(e.message)) { put(SK, null); state('Link not found', 'Please open the newest link Dongjae sent you.'); return; }
    state('Can’t connect', 'Check your internet and try again.', '<button class="hub-btn" type="button" id="retry">Try again</button>');
    document.getElementById('retry').onclick = load;
  }
  function home() { return 'me.html?k=' + encodeURIComponent(k) + (PREVIEW ? '#preview' : ''); }

  // 앱의 '더 쉬운/어려운 세트' 버튼 → me.html?req=easier|harder (키는 이 기기에 기억된 것)
  var req = qs('req');
  if (req === 'easier' || req === 'harder') {
    state('Sending…', '');
    var back = '<a class="hub-btn" href="' + esc(home()) + '">Back</a>';
    if (PREVIEW) { state('Preview', 'Requests are not saved in preview.', back); return; }
    call('student.request_sets', { kind: req }).then(function (r) {
      state(r.saved ? 'Request sent' : 'Already sent today', r.saved ? 'Dongjae will update your word card sets.' : 'Dongjae will check it soon.', back);
    }, fail);
    return;
  }

  function when(iso, tz) {
    // T146w: 학생 현지 시간대(서버 tz)로 + 짧은 시간대 이름. 보는 기기 시간대 아님.
    var o = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
    try { if (tz) o.timeZone = tz; return new Date(iso).toLocaleString('en-US', o); }
    catch (e) { try { delete o.timeZone; return new Date(iso).toLocaleString('en-US', o); } catch (e2) { return iso.slice(0, 16).replace('T', ' ') + ' UTC'; } }
  }
  function tile(o) {
    var dis = !o.href;
    return '<a class="hub-tile' + (o.main ? ' main' : '') + (dis ? ' off' : '') + '" data-act="' + o.act + '"' + (dis ? ' aria-disabled="true"' : ' href="' + esc(o.href) + '"') + '>' +
      '<span class="hub-ic">' + svg(o.icon) + '</span><span class="hub-t"><b>' + esc(o.title) + '</b><span>' + esc(o.meta) + '</span></span>' + (dis ? '' : svg('go', 'hub-go')) + '</a>';
  }
  function render(d) {
    var t = d.today || {}, hw;
    if (t.rest) hw = 'Day off today';
    else if (!t.n_tasks) hw = 'Opens soon';
    else if (!t.n_left) hw = 'All done today';
    else hw = t.n_left + (t.n_left === 1 ? ' task' : ' tasks') + ' · about ' + Math.max(1, t.min_left) + ' min';
    var ns = (d.flashcard_sets || []).length;
    var html = '<h1>Hi, ' + esc(d.first_name || 'there') + '</h1><div class="hub-tiles">' +
      tile({ act: 'hub-homework', main: true, icon: 'book', title: 'Homework', meta: hw, href: 'student.html?k=' + encodeURIComponent(k) + (PREVIEW ? '#preview' : '') }) +
      tile({ act: 'hub-class', icon: 'board', title: 'Class', meta: d.classroom_url ? 'Our whiteboard' : 'Link coming soon', href: d.classroom_url || '' }) +
      tile({ act: 'hub-cards', icon: 'cards', title: 'Word cards', meta: ns ? ns + ' sets for you' : 'Flashcards', href: d.flashcard_url || '' }) +
      '</div>';
    if (d.next_lesson_at) html += '<p class="hub-next" data-act="hub-next"><small>Next class</small>' + esc(when(d.next_lesson_at, d.tz)) + '</p>';
    html += '<p class="hub-tip">Tip: add this page to your home screen (Share → Add to Home Screen).</p>';
    app.innerHTML = html;
  }
  function load() {
    app.innerHTML = '<div class="hub-skel h"></div><div class="hub-tiles"><div class="hub-skel"></div><div class="hub-skel"></div><div class="hub-skel"></div></div>';
    call('student.hub').then(render, fail);
  }
  load();
})();
</script>
</body>
</html>
