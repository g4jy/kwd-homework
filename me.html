<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korean with Dongjae</title>
<meta name="theme-color" content="#F6F7FB">
<link rel="manifest" href="manifest-me.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=20261114141719">
<style>
/* T109 학생 허브: 링크 하나 → 오늘 과제 · 수업(화이트보드) · 단어 카드. 토큰은 app.css :root (앱 디자인 언어) */
.hub { max-width: 480px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 20px 40px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.hub h1 { font-size: 28px; line-height: 1.2; margin: 16px 0 24px; font-weight: 700; letter-spacing: -0.01em; }
.hub-tiles { display: flex; flex-direction: column; gap: 12px; }
.hub-tile { display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 16px 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: transparent; transition: transform .12s ease; }
.hub-tile:active { transform: scale(.98); }
.hub-tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* T146za 안 A(T155d): 해야 함·하는 중 = 남색 2px 테두리, 끝 = 초록 테두리+체크, 지난 과제 남음 = 노란 글씨 한 줄 */
.hub-tile.todo, .hub-tile.doing { border: 2px solid var(--accent); padding: 15px 19px; }
.hub-tile.done { border: 2px solid var(--ok); padding: 15px 19px; }
.hub-tile.done .hub-ic { background: var(--ok-soft); color: var(--ok); }
.hub-chk { flex: none; width: 24px; height: 24px; color: var(--ok); }
.hub-bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.hub-bar u { display: block; height: 100%; background: var(--accent); text-decoration: none; }
.hub-t .hub-late { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1.4; color: var(--warn); margin-top: 4px; }
.hub-late i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.hub-tile.off { opacity: .55; pointer-events: none; }
.hub-ic { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
.hub-ic svg { width: 26px; height: 26px; }
.hub-t { flex: 1; min-width: 0; }
.hub-t b { display: block; font-size: 19px; line-height: 1.3; font-weight: 600; }
.hub-t span { display: block; font-size: 15px; line-height: 1.4; margin-top: 2px; color: var(--ink-2); }
.hub-go { flex: none; width: 20px; height: 20px; opacity: .6; }
.hub-next { margin: 24px 0 0; font-size: 16px; color: var(--ink); }
.hub-next small { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 2px; }
.hub-rem { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin-top: 16px; font-size: 15px; color: var(--ink-2); }
.hub-rem select { min-height: 44px; padding: 0 12px; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; }
.hub-no { min-height: 44px; padding: 0 12px; font: inherit; color: var(--ink-2); background: none; border: 0; }
.hub-rem .hub-btn { margin: 0; }
.hub-rem-msg { flex-basis: 100%; min-height: 20px; font-size: 14px; text-align: right; }
.hub-tip { margin-top: auto; padding-top: 32px; font-size: 13px; color: var(--ink-2); }
.hub-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.hub-state h2 { font-size: 20px; margin: 0; }
.hub-state p { margin: 0; color: var(--ink-2); font-size: 15px; }
.hub-btn { min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.hub-skel { height: 88px; border-radius: var(--radius); background: var(--surface-2); animation: hubp 1.2s ease-in-out infinite; }
.hub-skel.h { height: 34px; width: 55%; margin: 16px 0 24px; }
@keyframes hubp { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .hub-skel { animation: none; } .hub-tile { transition: none; } }
@media (display-mode: standalone) { .hub-tip { display: none; } }
</style>
</head>
<body>
<div id="app" class="hub" aria-live="polite"></div>
<script src="config.js?v=20261114141719"></script>
<script src="ui.js?v=20261114141719"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var PREVIEW = /(^|[#&])preview\b/.test(location.hash || '');   // 선생님 미리 보기: 키 기억 안 함·요청 저장 안 함
  var KEEP = 60 * 864e5, SK = 'hw_student_key';   // student.html 과 같은 저장 칸 (같은 사이트)
  function qs(n) { var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
  function get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 사생활 모드 */ } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var IC = {
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5z"/><path d="M9 8h7M9 11.5h5"/>',
    board: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 12l3-3 2 2 4-4"/>',
    check: '<path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/>',
    cards: '<rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/>',
    go: '<path d="M9 5l7 7-7 7"/>',
    chk: '<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/>'
  };
  function svg(n, cls) { return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>'; }
  function state(title, text, btn) {
    app.innerHTML = '<div class="hub-state" role="status"><h2>' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') + (btn || '') + '</div>';
  }

  var k = qs('k'), saved = get(SK);
  if (saved && (typeof saved !== 'object' || !saved.k || Date.now() - (saved.at || 0) > KEEP)) { put(SK, null); saved = null; }
  if (!k && !PREVIEW && saved) k = saved.k;
  if (!k) { state('Link needed', 'Please open the link Dongjae sent you.'); return; }
  if (!PREVIEW) put(SK, { k: k, at: Date.now() });
  if (!PREVIEW && window.UI && UI.keepKey) UI.keepKey(k);   // T131b iOS 바로가기 키
  if (PREVIEW) { var bar = document.createElement('div'); bar.className = 'preview-bar'; bar.textContent = '선생님 미리 보기 — 기록이 남지 않아요.'; document.body.insertBefore(bar, document.body.firstChild); }

  function call(action, extra) {
    var body = { action: action, key: k }; for (var x in extra || {}) body[x] = extra[x];
    if (!PREVIEW) { try { body.tz_client = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* 없음 */ } }   // T087c 학생 기기 호출 = 서버 흔적(SEEN 'h') → 진단 칸 분량 빼기 판단
    return window.UI.call0(action, body);   // T117 상한(90초)·재시도·미리 보기 막기를 과제 화면과 같은 길로
  }
  function fail(e) {
    if (e && e.server && /unknown key/.test(e.message)) { put(SK, null); state('Link not found', 'Please open the newest link Dongjae sent you.'); return; }
    state('Can’t connect', 'Check your internet and try again.', '<button class="hub-btn" type="button" id="retry">Try again</button>');
    document.getElementById('retry').onclick = load;
  }
  function home() { return 'me.html?k=' + encodeURIComponent(k) + (PREVIEW ? '#preview' : ''); }

  // 앱의 '더 쉬운/어려운 세트' 버튼 → me.html?req=easier|harder (키는 이 기기에 기억된 것)
  var req = qs('req');
  if (req === 'easier' || req === 'harder') {
    state('Sending…', '');
    var back = '<a class="hub-btn" href="' + esc(home()) + '">Back</a>';
    if (PREVIEW) { state('Preview', 'Requests are not saved in preview.', back); return; }
    call('student.request_sets', { kind: req }).then(function (r) {
      state(r.saved ? 'Request sent' : 'Already sent today', r.saved ? 'Dongjae will update your word card sets.' : 'Dongjae will check it soon.', back);
    }, fail);
    return;
  }

  function when(iso, tz) {
    // T146w: 학생 현지 시간대(서버 tz)로 + 짧은 시간대 이름. 보는 기기 시간대 아님.
    var o = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
    try { if (tz) o.timeZone = tz; return new Date(iso).toLocaleString('en-US', o); }
    catch (e) { try { delete o.timeZone; return new Date(iso).toLocaleString('en-US', o); } catch (e2) { return iso.slice(0, 16).replace('T', ' ') + ' UTC'; } }
  }
  function tile(o) {
    var dis = !o.href;
    var right = dis ? '' : (o.st === 'done' ? svg('chk', 'hub-chk') : svg('go', 'hub-go'));
    return '<a class="hub-tile' + (o.st ? ' ' + o.st : '') + (dis ? ' off' : '') + '" data-act="' + o.act + '"' + (o.st ? ' data-st="' + o.st + '"' : '') + (dis ? ' aria-disabled="true"' : ' href="' + esc(o.href) + '"') + '>' +
      '<span class="hub-ic">' + svg(o.icon) + '</span><span class="hub-t"><b>' + esc(o.title) + '</b><span>' + esc(o.meta) + '</span>' + (o.extra || '') + '</span>' + right + '</a>';
  }
  function render(d) {
    var t = d.today || {}, hw, st = '', extra = '', nOv = Number(t.n_overdue) || 0;
    if (t.rest) hw = 'Day off today';
    else if (!t.n_tasks) hw = 'Opens soon';
    else if (!t.n_left) { hw = 'All done today'; st = 'done'; }
    else {
      hw = t.n_left + (t.n_left === 1 ? ' task' : ' tasks') + (t.n_left < t.n_tasks ? ' left' : '') + ' · about ' + Math.max(1, t.min_left) + ' min';
      st = (t.started || t.n_left < t.n_tasks) ? 'doing' : 'todo';
      var pct = Math.max(4, Math.round(100 * (t.n_tasks - t.n_left) / t.n_tasks));
      if (st === 'doing') extra = '<div class="hub-bar" role="progressbar" aria-label="Today" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><u style="width:' + pct + '%"></u></div>';
    }
    if (nOv > 0) extra += '<div class="hub-late" data-act="hub-late"><i></i>' + nOv + (nOv === 1 ? ' earlier task left' : ' earlier tasks left') + '</div>';
    var ns = (d.flashcard_sets || []).length;
    var html = '<h1>Hi, ' + esc(d.first_name || 'there') + '</h1><div class="hub-tiles">' +
      tile({ act: 'hub-homework', st: st, extra: extra, icon: 'book', title: 'Homework', meta: hw, href: 'student.html?k=' + encodeURIComponent(k) + (PREVIEW ? '#preview' : '') }) +
      (d.check ? tile({ act: 'hub-check', st: d.check.done ? 'done' : '', icon: 'check', title: 'Check',   // T087c 진단 칸 (과제와 따로, 하루 한 번 약 2분)
        meta: d.check.done ? 'Done today' : d.check.ready ? 'About ' + (d.check.min || 2) + ' min · words and grammar' : 'Next check tomorrow',
        href: d.check.ready || d.check.done ? 'check.html?k=' + encodeURIComponent(k) + (PREVIEW ? '#preview' : '') : '' }) : '') +
      tile({ act: 'hub-class', icon: 'board', title: 'Class', meta: d.classroom_url ? 'Our whiteboard' : 'Link coming soon', href: d.classroom_url || '' }) +
      tile({ act: 'hub-cards', icon: 'cards', title: 'Word cards', meta: ns ? ns + ' sets for you' : 'Flashcards', href: d.flashcard_url || '' }) +
      '</div>';
    if (d.next_lesson_at) html += '<p class="hub-next" data-act="hub-next"><small>Next class</small>' + esc(when(d.next_lesson_at, d.tz)) + '</p>';
    var showRem = d.remind && (d.remind.ui || PREVIEW || qs('remind') === '1');   // remind=1 = 켜기 전 선생님 기기 시험용
    var pv = showRem ? pushView(d) : '';
    if (pv === 'time') html += remRow(d.remind.at);
    else if (pv === 'ask') html += askRow();
    else if (pv === 'ios') html += '<div class="hub-rem" data-act="hub-push-ios">To get study reminders on iPhone, first add this page to your home screen, then open it from the icon.</div>';
    html += '<p class="hub-tip">Tip: add this page to your home screen (Share → Add to Home Screen).</p>';
    app.innerHTML = html;
    if (pv === 'time') remBind(d.remind.at);
    else if (pv === 'ask') askBind(d);
    else if (pv === 'ios') { put(ASKED, 1); iosShown = true; }   // 안내도 한 번만
  }
  /* T117c 앱 푸시 허락은 한 번만 묻는다: 누른 뒤(켬·나중에·거절)에는 다시 안 보임. 시간 칸은 이 기기가 허락했고 구독이 있을 때만 */
  var ASKED = 'hw_push_asked', iosShown = false;
  function pushView(d) {
    if (PREVIEW) return 'time';
    var perm = window.Notification ? Notification.permission : '';
    if (d.remind.push && perm === 'granted') return 'time';
    if (iosShown) return 'ios';   // 저장본 → 새 값으로 다시 그려도 이번 열기엔 그대로
    if (get(ASKED)) return '';
    if (U.pushIosHome()) return 'ios';
    return U.pushCan() && perm !== 'denied' ? 'ask' : '';
  }
  function askRow() {
    return '<div class="hub-rem" data-act="hub-push-ask"><span>Get a study reminder on this phone?</span><span>' +
      '<button class="hub-no" type="button" data-act="hub-push-no">Not now</button> <button class="hub-btn" type="button" data-act="hub-push-on">Turn on</button></span>' +
      '<span class="hub-rem-msg" id="hub-rem-msg" role="status"></span></div>';
  }
  function askBind(d) {
    var box = app.querySelector('[data-act="hub-push-ask"]'), msg = document.getElementById('hub-rem-msg');
    box.querySelector('[data-act="hub-push-no"]').onclick = function () { put(ASKED, 1); box.remove(); };
    box.querySelector('[data-act="hub-push-on"]').onclick = function () {
      put(ASKED, 1); msg.textContent = 'Turning on…'; this.disabled = true;
      U.pushOn(function (sub) { return call('student.push_sub', { subscription: sub, ua: navigator.userAgent }); }).then(function () {
        d.remind.push = true;
        var c = get(HK); if (c && c.d && c.d.remind) { c.d.remind.push = true; put(HK, c); }
        render(d);
      }, function (e) { msg.textContent = e && e.message === 'not allowed' ? 'Notifications are blocked on this phone.' : 'Couldn’t turn on. Please try again later.'; });
    };
  }
  /* T114 알림 시간: 작은 줄 하나. 서버 스위치가 켜진 뒤에만 학생에게 보임(선생님 미리 보기엔 보이고 저장 안 됨) */
  function remLabel(v) { var h = +v.slice(0, 2), m = v.slice(3); return (h % 12 || 12) + ':' + m + (h < 12 ? ' AM' : ' PM'); }
  function remRow(at) {
    var vs = ['off'], h;
    for (h = 7; h <= 23; h++) vs.push(('0' + h).slice(-2) + ':00');
    if (vs.indexOf(at) < 0) vs.push(at);
    return '<div class="hub-rem"><label for="hub-rem">Study reminder</label><select id="hub-rem" data-act="hub-remind"' + (PREVIEW ? ' disabled' : '') + '>' +
      vs.map(function (v) { return '<option value="' + esc(v) + '"' + (v === at ? ' selected' : '') + '>' + (v === 'off' ? 'Off' : esc(remLabel(v))) + '</option>'; }).join('') +
      '</select><span class="hub-rem-msg" id="hub-rem-msg" role="status"></span></div>';
  }
  function remBind(at) {
    var sel = document.getElementById('hub-rem'), msg = document.getElementById('hub-rem-msg'), cur = at;
    sel.onchange = function () {
      var v = sel.value;
      msg.textContent = 'Saving…'; sel.disabled = true;
      call('student.remind_set', { at: v }).then(function () {
        cur = v; msg.textContent = 'Saved'; sel.disabled = false;
        var c = get(HK); if (c && c.d && c.d.remind) { c.d.remind.at = v; put(HK, c); }
      }, function () { sel.value = cur; msg.textContent = 'Couldn’t save. Please try again.'; sel.disabled = false; });
    };
  }
  /* T146zb 첫 화면은 이 기기 저장본으로 바로 → 서버 값은 뒤에서 (바뀌면 다시 그림). 과제 화면 값(student.today)도 미리 받아 둠 → 과제 누르면 바로.
     과제 화면에서 못 보낸 제출(기기 줄)도 여기서 보냄 */
  var HK = 'hw_hub_' + String(k).slice(0, 80), U = window.UI, hubOk = false, pend = 0, slowStop = function () {}, pf = null;
  /* T117 과제 값을 받는 중에 Homework 를 누르면 끝날 때까지(최대 12초) 기다렸다 감: 같은 무거운 호출이 서버 잠금에서 겹치면 40초까지 늘어남 */
  app.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-act="hub-homework"]');
    if (!a || !pf || !a.href) return;
    e.preventDefault();
    var meta = a.querySelector('.hub-t span'); if (meta) meta.textContent = U.tx('Opening…', '여는 중…');
    var went = false, go = function () { if (went) return; went = true; location.href = a.href; };
    pf.then(go); setTimeout(go, 12000);
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) load(); });   // 뒤로 왔을 때 '여는 중…' 글이 남지 않게
  function load() {
    var c = get(HK), drew = false;
    if (c && c.d && Date.now() - (c.at || 0) < 7 * 864e5) { render(c.d); drew = true; }
    else { app.innerHTML = '<div class="hub-skel h"></div><div class="hub-tiles"><div class="hub-skel"></div><div class="hub-skel"></div><div class="hub-skel"></div></div>'; slowStop(); slowStop = U.slowWatch(app, load, '.hub-skel'); }
    pend++;
    call('student.hub').then(function (d) {
      pend--; slowStop(); hubOk = true;
      if (!drew || JSON.stringify(d) !== JSON.stringify(c.d)) render(d);
      put(HK, { at: Date.now(), d: d });
    }, function (e) {
      pend--;
      var bad = e && e.server && /unknown key/.test(e.message);
      if (!bad && (hubOk || pend > 0)) return;   // T117 다른 시도가 이미 그렸거나 아직 기다리는 중
      slowStop();
      if (!drew || bad) fail(e);
    });
    if (U && U.dayCache) {
      var dc = U.dayCache.get(k);
      if (!pf && !(dc && dc.d.day.local_date === U.todayIn(dc.d.student.tz))) pf = call('student.today').then(function (d) { if (d && d.day && d.student) U.dayCache.set(k, d); }, function () {}).then(function () { pf = null; });
      if (!PREVIEW && U.Outbox) { try { new U.Outbox('s_' + k).flush(); } catch (e) { /* 다음에 과제 화면에서 */ } }
    }
  }
  load();
  if (qs('n') && !PREVIEW) call('student.notif', { notif_id: qs('n'), event: 'opened' }).catch(function () {});   // T114 알림 눌러 허브로 옴
})();
</script>
</body>
</html>
