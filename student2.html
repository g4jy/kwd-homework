  (function () {
    var k = UI.qs('k');
    // 10/20 홈 화면 앱: 처음 링크로 열 때 키를 이 기기에 기억 → 홈 화면 아이콘(키 없는 주소)으로 열어도 같은 학생 (미리 보기는 기억 안 함)
    // 기억은 60일 (쓸 때마다 다시 60일) — 공용 기기에 오래 남지 않게
    var KEEP = 60 * 864e5, saved = UI.store.get('hw_student_key', null);
    if (saved && (typeof saved !== 'object' || !saved.k || Date.now() - (saved.at || 0) > KEEP)) { UI.store.set('hw_student_key', null); saved = null; }
    
    // T108c v2 미리보기: 키를 기기에 기억하지 않음
    if (!k) { document.getElementById('app').innerHTML = '<div class="wrap"><div class="state" role="alert" data-act="no-key"><div class="state-ic" aria-hidden="true">!</div><h2>Link needed</h2><p class="small">Please open the link Dongjae sent you. 선생님이 보낸 링크로 열어 주세요.</p></div></div>'; return; }
    if (UI.PREVIEW) { var bar = document.createElement('div'); bar.className = 'preview-bar'; bar.setAttribute('data-act', 'preview-bar'); bar.textContent = '선생님 미리 보기 — 학생이 보는 화면이에요. 눌러도 저장되지 않아요.'; document.body.insertBefore(bar, document.body.firstChild); }
    StudentApp.mount(document.getElementById('app'), { key: k });
  })();
</script>
