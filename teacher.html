<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KWD 숙제 · 선생님</title>
<link rel="stylesheet" href="app.css?v=20261031221719">
</head>
<body>
<div id="app"></div>
<script src="config.js?v=20261031221719"></script>
<script src="hangul.js?v=20261031221719"></script>
<script src="ui.js?v=20261031221719"></script>
<script src="charts.js?v=20261031221719"></script>
<script src="criteria.js?v=20261031221719"></script>
<script src="teacher.js?v=20261031221719"></script>
<script>
  (function () {
    // 선생님 키는 이 브라우저에만 저장. 링크의 #t= (해시는 서버로 안 감)로 한 번 넣으면 주소에서 지움. 저장소·코드에는 없음.
    var hm = /[#&]t=([^&]+)/.exec(location.hash), t = hm ? decodeURIComponent(hm[1]) : null;
    // T146o 학생 바로 가기: #t=<키>&s=st_N(&d=YYYY-MM-DD 그날 제출) — 키를 지운 뒤에도 s·d 는 남김
    var sm = /[#&]s=([A-Za-z0-9_]+)/.exec(location.hash), dm = /[#&]d=(\d{4}-\d{2}-\d{2})/.exec(location.hash);
    var deep = sm ? { sid: sm[1], date: dm ? dm[1] : null } : null;
    if (t) history.replaceState(null, '', location.pathname + location.search + (deep ? '#s=' + deep.sid + (deep.date ? '&d=' + deep.date : '') : ''));
    if (t) UI.store.set('hw2_tkey', t);
    var key = UI.store.get('hw2_tkey', null);
    if (!key) {
      var app = document.getElementById('app');
      app.innerHTML = '<div class="wrap"><div class="card"><h2>선생님 키</h2><p class="small">스크립트 속성의 TEACHER_KEY 를 붙여 넣으세요. 이 브라우저에만 저장돼요.</p></div></div>';
      var inp = UI.el('input', { class: 'text', type: 'password', placeholder: 'TEACHER_KEY' });
      app.querySelector('.card').appendChild(inp);
      app.querySelector('.card').appendChild(UI.btn('저장', 'primary sm', function () { UI.store.set('hw2_tkey', inp.value.trim()); location.reload(); }));
      return;
    }
    TeacherApp.mount(document.getElementById('app'), { tkey: key, deep: deep });
  })();
</script>
</body>
</html>
