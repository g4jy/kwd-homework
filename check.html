<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check · Korean with Dongjae</title>
<meta name="theme-color" content="#F6F7FB">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=20261107190152">
<style>
/* T087c 허브 '진단' 칸: 쉬운 단어 훑기(가짜 단어 섞임 안내 → 20장 → 되묻기 4) → 지난 문형 2 → 끝(그날 Quick check 상태). 답은 끝에 한 번 student.check_save */
.ck { max-width: 480px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 20px 32px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.ck-top { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.ck-top a { font-size: 15px; color: var(--accent); text-decoration: none; padding: 10px 0; }
.ck-top span { margin-left: auto; font-size: 14px; color: var(--ink-2); }
.ck-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 4px 0 20px; }
.ck-bar u { display: block; height: 100%; background: var(--accent); text-decoration: none; }
.ck-lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; }
.ck-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 20px; }
.ck-word { font-size: 40px; line-height: 1.25; font-weight: 700; text-align: center; margin: 24px 0 28px; word-break: keep-all; }
.ck-h { font-size: 22px; line-height: 1.3; font-weight: 700; margin: 0 0 12px; }
.ck-p { font-size: 16px; line-height: 1.5; margin: 0 0 12px; color: var(--ink); }
.ck-p.sm { font-size: 14px; color: var(--ink-2); }
.ck-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.ck-b { min-height: 56px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 600; padding: 8px 12px; cursor: pointer; line-height: 1.25; }
.ck-b.no { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.ck-b.yes { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.ck-b.wide { grid-column: 1 / -1; }
.ck-b:active { transform: scale(.98); }
.ck-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.ck-opt { text-align: left; min-height: 52px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1.35; padding: 12px 16px; cursor: pointer; }
.ck-opt.dk { color: var(--ink-2); font-size: 15px; }
.ck-opt.right { border: 2px solid var(--ok); background: var(--ok-soft); }
.ck-opt.wrong { border: 2px solid var(--bad); background: var(--bad-soft); }
.ck-stem { font-size: 22px; line-height: 1.4; font-weight: 600; margin: 4px 0 8px; word-break: keep-all; }
.ck-help { font-size: 14px; color: var(--ink-2); margin: 0 0 16px; }
.ck-note { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin: 14px 0 4px; font-size: 15px; line-height: 1.5; }
.ck-note b { display: block; font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }
.ck-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 16px; }
.ck-row:first-child { border-top: 0; }
.ck-row i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
.ck-row i.ok { background: var(--ok); }
.ck-row a { margin-left: auto; color: var(--accent); font-size: 15px; text-decoration: none; padding: 8px 0; }
.ck-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.ck-state h2 { margin: 0; font-size: 20px; }
.ck-state p { margin: 0; color: var(--ink-2); font-size: 15px; }
.ck-save { font-size: 14px; margin: 12px 0 0; color: var(--ink-2); }
.ck-save.ok { color: var(--ok); } .ck-save.bad { color: var(--bad); }
.ck-foot { margin-top: 20px; }
</style>
</head>
<body>
<div id="app" class="ck" aria-live="polite"></div>
<script src="config.js?v=20261107190152"></script>
<script src="ui.js?v=20261107190152"></script>
<script>
(function () {
  'use strict';
  var U = window.UI, app = document.getElementById('app'), T = U.tx;
  var SK = 'hw_student_key', KEEP = 60 * 864e5;
  function qs(n) { var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
  function get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function put(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 사생활 모드 */ } }
  function el() { return U.el.apply(U, arguments); }
  var k = qs('k'), saved = get(SK);
  if (!k && !U.PREVIEW && saved && saved.k && Date.now() - (saved.at || 0) < KEEP) k = saved.k;
  function hub() { return 'me.html?k=' + encodeURIComponent(k || '') + (U.PREVIEW ? '#preview' : ''); }
  function hw() { return 'student.html?k=' + encodeURIComponent(k || '') + (U.PREVIEW ? '#preview' : ''); }
  function state(title, text, btn) { app.innerHTML = ''; app.appendChild(el('div', { class: 'ck-state', role: 'status' }, el('h2', {}, title), text ? el('p', {}, text) : null, btn || null)); }
  if (!k) { state(T('Link needed', '링크가 필요해요'), T('Please open the link Dongjae sent you.', '선생님이 보낸 링크를 열어 주세요.')); return; }

  var D = null, S = null, t0 = Date.now(), PK;   // D = 서버 {date, items, quick, done} · S = 이 기기 진행(새로 고침해도 이어서)
  function save() { if (!U.PREVIEW) put(PK, S); }
  function top(n, of) {
    var w = el('div', {}, el('div', { class: 'ck-top' }, el('a', { href: hub(), 'data-act': 'ck-back' }, T('‹ Back', '‹ 뒤로')), of ? el('span', { 'data-act': 'ck-count' }, n + ' / ' + of) : null));
    if (of) w.appendChild(el('div', { class: 'ck-bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(of), 'aria-valuenow': String(n) }, el('u', { style: { width: Math.max(4, Math.round(100 * n / of)) + '%' } })));
    return w;
  }
  function show() { app.innerHTML = ''; for (var i = 0; i < arguments.length; i++) if (arguments[i]) app.appendChild(arguments[i]); window.scrollTo(0, 0); }

  function load() {
    state(T('Loading…', '불러오는 중…'), '');
    U.call('student.check', { key: k }).then(function (d) {
      D = d; PK = 'hw_ck_' + String(k).slice(0, 60) + '_' + d.date;
      if (!d.items) { state(T('No check today', '오늘은 확인할 게 없어요'), T('Come back tomorrow.', '내일 다시 와 주세요.'), el('a', { class: 'ck-b', href: hub(), style: { display: 'inline-flex', alignItems: 'center' } }, T('Back', '뒤로'))); return; }
      if (d.done) { S = { step: 'end', saved: 'ok' }; return end(); }
      S = (U.PREVIEW ? null : get(PK)) || { step: 'intro', i: 0, cards: [], fakeYes: 0, re: [], reIdx: [], g: 0, gram: [] };
      route();
    }, function (e) {
      if (e && e.server && /unknown key/.test(e.message)) { state(T('Link not found', '링크를 찾을 수 없어요'), T('Please open the newest link Dongjae sent you.', '선생님이 보낸 새 링크를 열어 주세요.')); return; }
      state(T('Can’t connect', '연결할 수 없어요'), T('Check your internet and try again.', '인터넷을 확인하고 다시 해 주세요.'), el('button', { class: 'ck-b', type: 'button', 'data-act': 'ck-retry', onclick: load }, T('Try again', '다시 하기')));
    });
  }
  function route() {
    var sw = D.items.sweep || {};
    if (S.step === 'intro') return intro();
    if (S.step === 'sweep') return S.i < (sw.cards || []).length ? card() : toRe();
    if (S.step === 're') return S.reAt < S.reIdx.length ? recheck() : toGram();
    if (S.step === 'gram') return S.g < (D.items.grammar || []).length ? gram() : finish();
    end();
    if (S.result && S.saved !== 'ok' && S.saved !== 'gone') send();   // 다시 열었는데 저장이 안 됐던 답 → 다시 보냄
  }
  function intro() {
    var n = D.items.notice || {}, sw = D.items.sweep || {};
    show(top(), el('p', { class: 'ck-lbl' }, T('Check · about ' + (D.items.min || 2) + ' min', '확인 · 약 ' + (D.items.min || 2) + '분')),
      el('div', { class: 'ck-card', 'data-act': 'ck-notice' },
        el('h2', { class: 'ck-h' }, T('Do you know these words?', '이 단어를 알아요?')),
        el('p', { class: 'ck-p' }, T(n.en, n.ko)),
        el('p', { class: 'ck-p sm' }, T((sw.cards || []).length + ' words, then 2 grammar questions. Not part of your score.', '단어 ' + (sw.cards || []).length + '개, 문법 2문제. 점수에 들어가지 않아요.')),
        el('div', { class: 'ck-btns' }, el('button', { class: 'ck-b yes wide', type: 'button', 'data-act': 'ck-start', onclick: function () { S.step = 'sweep'; t0 = Date.now(); save(); route(); } }, T('Start', '시작')))));
  }
  function card() {
    var sw = D.items.sweep, c = sw.cards[S.i], n = D.items.notice || {};
    function pick(a) {
      S.cards.push({ w: c.w, a: a });
      if (c.fake && a === 'know') S.fakeYes++;
      var nf = sw.cards.filter(function (x) { return x.fake; }).length || 1;
      S.i++;
      if (S.fakeYes / nf > (sw.f_stop || 0.4)) { S.stopped = true; S.i = sw.cards.length; }   // 가짜를 너무 많이 '알아요' → 훑기 멈춤
      save(); route();
    }
    show(top(S.i + 1, sw.cards.length), el('p', { class: 'ck-lbl' }, T('Words', '단어')),
      el('div', { class: 'ck-card', 'data-act': 'ck-card' }, el('div', { class: 'ck-word', lang: 'ko' }, c.ko),
        el('div', { class: 'ck-btns' },
          el('button', { class: 'ck-b no', type: 'button', 'data-act': 'ck-no', onclick: function () { pick('no'); } }, T(n.button_en || 'Not a word / Don’t know', n.button_ko || '없는 말 / 몰라요')),
          el('button', { class: 'ck-b yes', type: 'button', 'data-act': 'ck-know', onclick: function () { pick('know'); } }, T('I know it', '알아요')))));
  }
  function toRe() {
    var sw = D.items.sweep, re = sw.re || {}, kn = S.cards.filter(function (x) { return x.a === 'know' && re[x.w]; }).map(function (x) { return x.w; });
    for (var i = kn.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = kn[i]; kn[i] = kn[j]; kn[j] = t; }
    S.reIdx = S.stopped ? [] : kn.slice(0, sw.n_re || 4); S.reAt = 0; S.step = 're'; save(); route();
  }
  function recheck() {
    var sw = D.items.sweep, w = S.reIdx[S.reAt], q = sw.re[w], ko = (sw.cards.filter(function (c) { return c.w === w; })[0] || {}).ko, done = false;
    var opts = el('div', { class: 'ck-opts' });
    q.c.forEach(function (o, i) {
      var b = el('button', { class: 'ck-opt', type: 'button', lang: 'en', 'data-act': 'ck-re-opt', onclick: function () {
        if (done) return; done = true;
        S.re.push({ w: w, ok: i === q.a }); S.reAt++; save();
        b.className += i === q.a ? ' right' : ' wrong';
        setTimeout(route, 450);
      } }, o);
      opts.appendChild(b);
    });
    show(top(S.reAt + 1, S.reIdx.length), el('p', { class: 'ck-lbl' }, T('Quick question', '하나만 더')),
      el('div', { class: 'ck-card', 'data-act': 'ck-recheck' }, el('p', { class: 'ck-p' }, T('What does this word mean?', '이 단어 뜻이 뭐예요?')),
        el('div', { class: 'ck-word', lang: 'ko', style: { margin: '8px 0 20px' } }, ko), opts));
  }
  function toGram() { S.step = 'gram'; S.g = S.g || 0; save(); route(); }
  function gram() {
    var g = D.items.grammar[S.g], picked = null;
    var help = Object.keys(g.word_help || {}).map(function (x) { return x + ' = ' + g.word_help[x]; }).join(' · ');
    var opts = el('div', { class: 'ck-opts' }), after = el('div', {});
    function answer(i) {
      if (picked !== null) return; picked = i;
      var a = i === g.answer ? 'correct' : i < 0 ? 'unknown' : 'wrong';
      S.gram.push({ id: g.id, unit: g.unit, a: a }); save();
      Array.prototype.forEach.call(opts.children, function (b, j) { if (j === g.answer) b.className += ' right'; else if (j === i) b.className += ' wrong'; });
      if (a !== 'correct' && (g.card_en || g.example_ko)) after.appendChild(el('div', { class: 'ck-note', 'data-act': 'ck-pattern' }, el('b', { lang: 'ko' }, g.pattern || ''),
        g.card_en ? el('div', {}, g.card_en) : null, g.example_ko ? el('div', { lang: 'ko', style: { marginTop: '6px' } }, g.example_ko) : null, g.example_en ? el('div', { class: 'ck-p sm', style: { margin: '2px 0 0' } }, g.example_en) : null));
      after.appendChild(el('div', { class: 'ck-btns' }, el('button', { class: 'ck-b yes wide', type: 'button', 'data-act': 'ck-next', onclick: function () { S.g++; save(); route(); } }, T('Next', '다음'))));
      if (a === 'correct') setTimeout(function () { if (S.gram.length === S.g + 1) { S.g++; save(); route(); } }, 700);
    }
    g.choices.forEach(function (o, i) { opts.appendChild(el('button', { class: 'ck-opt', type: 'button', 'data-act': 'ck-g-opt', lang: /[가-힣]/.test(o) ? 'ko' : 'en', onclick: function () { answer(i); } }, o)); });
    opts.appendChild(el('button', { class: 'ck-opt dk', type: 'button', 'data-act': 'ck-g-dk', onclick: function () { answer(-1); } }, T('I don’t know', '모르겠어요')));
    show(top(S.g + 1, D.items.grammar.length), el('p', { class: 'ck-lbl' }, T('Grammar', '문법')),
      el('div', { class: 'ck-card', 'data-act': 'ck-grammar' }, el('p', { class: 'ck-p sm' }, g.prompt_en || T('Choose one.', '하나 고르세요.')),
        el('div', { class: 'ck-stem', lang: 'ko' }, g.stem_ko), help ? el('p', { class: 'ck-help', lang: 'ko' }, help) : null, opts, after));
  }
  function finish() {
    S.step = 'end'; S.result = { sweep: { level: (D.items.sweep || {}).level, cards: S.cards, re: S.re, stopped: !!S.stopped }, grammar: S.gram, sec: Math.round((Date.now() - t0) / 1000) };
    S.saved = 'sending'; save(); end(); send();
  }
  function send() {
    if (U.PREVIEW) { S.saved = 'preview'; return end(); }
    U.call('student.check_save', { key: k, date: D.date, result: S.result }).then(function () { S.saved = 'ok'; save(); end(); },
      function (e) { S.saved = e && e.server && /no check/.test(e.message) ? 'gone' : 'bad'; save(); end(); });
  }
  function end() {
    var q = D.quick, msg = { ok: T('Saved ✓', '저장됐어요 ✓'), sending: T('Saving…', '저장하는 중…'), bad: T('Not saved yet.', '아직 저장 안 됐어요.'), gone: T('This check has changed. Please open it again tomorrow.', '확인이 바뀌었어요. 내일 다시 열어 주세요.'), preview: T('Preview — not saved.', '미리 보기 — 저장 안 함') }[S.saved] || '';
    var rows = el('div', { class: 'ck-card', style: { padding: '4px 20px' } },
      el('div', { class: 'ck-row', 'data-act': 'ck-row-check' }, el('i', { class: 'ok' }), T('Words and grammar', '단어·문법')),
      q ? el('div', { class: 'ck-row', 'data-act': 'ck-row-quick' }, el('i', { class: q.status === 'done' || q.status === 'sent' ? 'ok' : '' }),
        T('Quick check', '빠른 확인') + ' · ' + (q.status === 'done' || q.status === 'sent' ? T('done', '끝') : T('in today’s homework', '오늘 숙제 안에')),
        q.status === 'done' || q.status === 'sent' ? null : el('a', { href: hw(), 'data-act': 'ck-to-hw' }, T('Open', '열기'))) : null);
    show(top(), el('p', { class: 'ck-lbl' }, T('Check', '확인')),
      el('div', { class: 'ck-card', 'data-act': 'ck-end' }, el('h2', { class: 'ck-h' }, T('Thanks! All done.', '고마워요! 다 했어요.')),
        el('p', { class: 'ck-p' }, T('Dongjae will use this to pick words for you. Unknown words will come back in your word cards.', '선생님이 이걸 보고 단어를 골라요. 모르는 단어는 단어 카드로 다시 나와요.')),
        el('p', { class: 'ck-save ' + (S.saved === 'ok' ? 'ok' : S.saved === 'bad' || S.saved === 'gone' ? 'bad' : ''), 'data-act': 'ck-save' }, msg),
        S.saved === 'bad' ? el('div', { class: 'ck-btns' }, el('button', { class: 'ck-b wide', type: 'button', 'data-act': 'ck-resend', onclick: function () { S.saved = 'sending'; end(); send(); } }, T('Send again', '다시 보내기'))) : null),
      el('div', { style: { height: '12px' } }), rows,
      el('div', { class: 'ck-foot ck-btns' }, el('a', { class: 'ck-b yes wide', href: hub(), 'data-act': 'ck-done', style: { display: 'flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' } }, T('Back to home', '처음으로'))));
  }
  load();
})();
</script>
</body>
</html>
